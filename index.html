<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Order Assistant V1.4 Ultra Fast</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }
    .card {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 5px; font-size: 26px; }
    .sub { color: #666; margin-bottom: 18px; }
    label { display: block; margin: 14px 0 7px; font-weight: 700; }
    input[type="number"], input[type="file"] {
      width: 100%;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
    }
    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: 0;
      border-radius: 13px;
      background: #111;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
    }
    button.secondary {
      background: #e9e9ed;
      color: #111;
    }
    button:disabled { opacity: .45; }
    #preview {
      display: none;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      margin-top: 14px;
      border-radius: 12px;
      background: #eee;
    }
    .status {
      margin-top: 13px;
      padding: 11px;
      border-radius: 11px;
      background: #f2f2f4;
      color: #555;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .progress {
      display: none;
      height: 7px;
      margin-top: 11px;
      background: #ddd;
      border-radius: 999px;
      overflow: hidden;
    }
    #bar {
      width: 0%;
      height: 100%;
      background: #111;
      transition: width .15s ease;
    }
    .result {
      display: none;
      margin-top: 18px;
      padding: 17px;
      border-radius: 16px;
      background: #f2f2f4;
    }
    .decision {
      font-size: 31px;
      font-weight: 900;
      margin-bottom: 14px;
    }
    .good { color: #15803d; }
    .bad { color: #c62828; }
    .row { padding: 5px 0; font-size: 17px; }
    .big { font-weight: 800; }
    .note {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      line-height: 1.45;
    }
    details { margin-top: 15px; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 10px;
      background: #fff;
      border-radius: 10px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>

<body>
<div class="card">

  <h1>Order Assistant V1.4</h1>
  <div class="sub">Ultra Fast：只掃訂單區 + 預設加 2 分鐘等客時間</div>

  <label for="threshold">最低接受時薪 ($/hr)</label>
  <input id="threshold" type="number" inputmode="decimal" value="30" min="0" step="1">

  <label for="imageInput">選擇 Uber / Mubo 訂單截圖</label>
  <input id="imageInput" type="file" accept="image/*">

  <img id="preview" alt="訂單截圖">

  <button id="analyzeBtn" disabled>快速重新分析</button>
  <button id="fullScanBtn" class="secondary" disabled>讀不到時才用：完整掃描</button>

  <div class="progress" id="progress"><div id="bar"></div></div>
  <div class="status" id="status">正在準備 OCR…</div>

  <div class="status" id="liveTimer" style="display:none;">
    ⏱ 已分析：0.0 秒
  </div>

  <div class="result" id="result">
    <div id="decision" class="decision"></div>

    <div class="row">💰 總價：<span id="price" class="big">—</span></div>
    <div class="row">🚗 去接客：<span id="pickupTime" class="big">—</span> 分鐘</div>
    <div class="row">🧍 行程：<span id="tripTime" class="big">—</span> 分鐘</div>
    <div class="row">⌛ 等客時間：<span class="big">2</span> 分鐘</div>
    <div class="row">⏱ 計算總時間：<span id="totalTime" class="big">—</span> 分鐘</div>
    <div class="row">💵 預計時薪：<span id="hourly" class="big">—</span></div>

    <div class="row">📍 去接客距離：<span id="pickupDistance" class="big">—</span></div>
    <div class="row">🛣 行程距離：<span id="tripDistance" class="big">—</span></div>
    <div class="row">🚘 總距離：<span id="totalDistance" class="big">—</span></div>
    <div class="row">💲 每英里：<span id="perMile" class="big">—</span></div>

    <div class="row">⚡ 本次分析：<span id="elapsed" class="big">—</span></div>

    <details>
      <summary>查看 OCR 原文</summary>
      <pre id="ocrText"></pre>
    </details>
  </div>

  <div class="note">
    計算公式：價格 ÷ ((去接客時間 + 行程時間 + 2 分鐘等客) ÷ 60)。
    快速模式不會自動掃整張圖，避免浪費時間；只有讀不到時才按「完整掃描」。
  </div>

</div>

<script>
"use strict";

const WAIT_MINUTES = 2;
const FAST_MAX_WIDTH = 620;

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const analyzeBtn = document.getElementById("analyzeBtn");
const fullScanBtn = document.getElementById("fullScanBtn");
const thresholdInput = document.getElementById("threshold");
const statusBox = document.getElementById("status");
const progress = document.getElementById("progress");
const bar = document.getElementById("bar");
const resultBox = document.getElementById("result");
const liveTimer = document.getElementById("liveTimer");

let selectedFile = null;
let worker = null;
let ocrReady = false;
let busy = false;

let analysisTimerId = null;
let analysisTimerStart = 0;

function startAnalysisTimer() {
  analysisTimerStart = performance.now();
  liveTimer.style.display = "block";
  liveTimer.textContent = "⏱ 已分析：0.0 秒";

  if (analysisTimerId) clearInterval(analysisTimerId);

  analysisTimerId = setInterval(() => {
    const seconds = (performance.now() - analysisTimerStart) / 1000;
    liveTimer.textContent = "⏱ 已分析：" + seconds.toFixed(1) + " 秒";
  }, 100);
}

function stopAnalysisTimer() {
  if (analysisTimerId) {
    clearInterval(analysisTimerId);
    analysisTimerId = null;
  }

  const seconds = (performance.now() - analysisTimerStart) / 1000;
  liveTimer.textContent = "✅ 分析用時：" + seconds.toFixed(1) + " 秒";
  return seconds;
}

const savedThreshold = localStorage.getItem("orderAssistantThreshold");
if (savedThreshold !== null) thresholdInput.value = savedThreshold;

thresholdInput.addEventListener("change", () => {
  localStorage.setItem("orderAssistantThreshold", thresholdInput.value);
});

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.async = true;
    s.onload = resolve;
    s.onerror = () => {
      s.remove();
      reject(new Error("載入失敗：" + src));
    };
    document.head.appendChild(s);
  });
}

async function loadTesseract() {
  const sources = [
    "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js",
    "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"
  ];

  for (const src of sources) {
    try {
      await loadScript(src);
      if (window.Tesseract) {
        ocrReady = true;
        statusBox.textContent = "✅ OCR 已載入，正在預熱…";
        updateButtons();
        await ensureWorker();
        if (!selectedFile) statusBox.textContent = "✅ 已準備好。選擇截圖後會自動快速分析。";
        return;
      }
    } catch (e) {
      console.warn(e);
    }
  }

  statusBox.textContent =
    "❌ OCR 無法載入。\n請確認有網路，並用 Safari / HTTPS 網頁開啟。";
}

function logger(m) {
  if (typeof m.progress === "number") {
    progress.style.display = "block";
    bar.style.width = Math.round(m.progress * 100) + "%";
  }
}

async function ensureWorker() {
  if (worker) return worker;
  if (!window.Tesseract) throw new Error("Tesseract 尚未載入。");

  worker = await window.Tesseract.createWorker("eng", 1, { logger });

  await worker.setParameters({
    tessedit_pageseg_mode: "11",
    preserve_interword_spaces: "1",
    tessedit_char_whitelist:
      "0123456789.$,abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ "
  });

  return worker;
}

function updateButtons() {
  const disabled = !selectedFile || !ocrReady || busy;
  analyzeBtn.disabled = disabled;
  fullScanBtn.disabled = disabled;
}

function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror = () => reject(new Error("無法讀取圖片。"));
    img.src = url;
  });
}

function makeCrop(img, fullScan) {
  let cropX = 0;
  let cropY = 0;
  let cropW = img.naturalWidth;
  let cropH = img.naturalHeight;

  if (!fullScan) {
    /*
      Uber / 類似訂單畫面通常重要資料集中在中下區域。
      快速模式只掃下方約 62%，減少 OCR 像素。
    */
    cropY = Math.floor(img.naturalHeight * 0.38);
    cropH = img.naturalHeight - cropY;
  }

  const maxWidth = fullScan ? 760 : FAST_MAX_WIDTH;
  const scale = Math.min(1, maxWidth / cropW);

  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(cropW * scale));
  canvas.height = Math.max(1, Math.round(cropH * scale));

  const ctx = canvas.getContext("2d");
  ctx.drawImage(
    img,
    cropX, cropY, cropW, cropH,
    0, 0, canvas.width, canvas.height
  );

  return canvas;
}

function normalizeText(text) {
  return (text || "")
    .replace(/\r/g, "\n")
    .replace(/[|]/g, "I")
    .replace(/[“”]/g, "\"")
    .replace(/[‘’]/g, "'");
}

function extractOrderData(text) {
  const t = normalizeText(text);

  let price = null;

  const dollarMatch = t.match(/\$\s*([0-9]{1,3}(?:[.,][0-9]{1,2})?)/);
  if (dollarMatch) {
    price = parseFloat(dollarMatch[1].replace(",", "."));
  } else {
    const sMatch = t.match(/\b[Ss]\s*([0-9]{1,3}[.,][0-9]{2})\b/);
    if (sMatch) {
      price = parseFloat(sMatch[1].replace(",", "."));
    } else {
      const fallback = t.match(/\b([0-9]{1,3}[.,][0-9]{2})\b/);
      if (fallback) price = parseFloat(fallback[1].replace(",", "."));
    }
  }

  const times = [...t.matchAll(
    /\b([0-9]{1,3})\s*(?:min|mins|minute|minutes)\b/gi
  )]
    .map(m => parseInt(m[1], 10))
    .filter(n => n > 0 && n <= 300);

  const distances = [...t.matchAll(
    /\b([0-9]+(?:[.,][0-9]+)?)\s*(?:mi|mile|miles)\b/gi
  )]
    .map(m => parseFloat(m[1].replace(",", ".")))
    .filter(n => n >= 0 && n < 500);

  return { price, times, distances };
}

function render(data, rawText, startedAt) {
  if (data.price === null || data.times.length < 2) {
    document.getElementById("ocrText").textContent = rawText;
    resultBox.style.display = "block";
    throw new Error(
      "快速模式讀不到完整「價格 + 兩段時間」。請按下面的「完整掃描」。"
    );
  }

  const pickupTime = data.times[0];
  const tripTime = data.times[1];

  // 使用者要求：固定加 2 分鐘等客時間
  const totalTime = pickupTime + tripTime + WAIT_MINUTES;

  const hourly = data.price / (totalTime / 60);
  const threshold = parseFloat(thresholdInput.value) || 0;
  const shouldAccept = hourly >= threshold;

  const pickupDistance = data.distances.length >= 1 ? data.distances[0] : null;
  const tripDistance = data.distances.length >= 2 ? data.distances[1] : null;

  const totalDistance =
    pickupDistance !== null && tripDistance !== null
      ? pickupDistance + tripDistance
      : null;

  const perMile =
    totalDistance !== null && totalDistance > 0
      ? data.price / totalDistance
      : null;

  document.getElementById("price").textContent = "$" + data.price.toFixed(2);
  document.getElementById("pickupTime").textContent = pickupTime;
  document.getElementById("tripTime").textContent = tripTime;
  document.getElementById("totalTime").textContent = totalTime;
  document.getElementById("hourly").textContent = "$" + hourly.toFixed(2) + "/hr";

  document.getElementById("pickupDistance").textContent =
    pickupDistance !== null ? pickupDistance.toFixed(1) + " mi" : "未讀到";

  document.getElementById("tripDistance").textContent =
    tripDistance !== null ? tripDistance.toFixed(1) + " mi" : "未讀到";

  document.getElementById("totalDistance").textContent =
    totalDistance !== null ? totalDistance.toFixed(1) + " mi" : "未讀到";

  document.getElementById("perMile").textContent =
    perMile !== null ? "$" + perMile.toFixed(2) + "/mi" : "未讀到";

  document.getElementById("elapsed").textContent =
    ((performance.now() - startedAt) / 1000).toFixed(1) + " 秒";

  document.getElementById("ocrText").textContent = rawText;

  const decision = document.getElementById("decision");
  decision.textContent = shouldAccept ? "✅ 可以接" : "❌ 不建議接";
  decision.className = shouldAccept ? "decision good" : "decision bad";

  resultBox.style.display = "block";
}

async function analyzeOrder(fullScan = false) {
  if (!selectedFile || busy) return;

  busy = true;
  updateButtons();
  resultBox.style.display = "none";
  progress.style.display = "block";
  bar.style.width = "3%";

  const startedAt = performance.now();
  startAnalysisTimer();

  try {
    statusBox.textContent = fullScan
      ? "正在完整掃描…"
      : "⚡ 正在快速掃描訂單區…";

    const img = await fileToImage(selectedFile);
    const canvas = makeCrop(img, fullScan);
    const w = await ensureWorker();

    const recognition = await w.recognize(canvas);
    const rawText = recognition.data.text || "";
    const data = extractOrderData(rawText);

    render(data, rawText, startedAt);

    bar.style.width = "100%";

    const finalSeconds = stopAnalysisTimer();
    document.getElementById("elapsed").textContent =
      finalSeconds.toFixed(1) + " 秒";

    statusBox.textContent = fullScan
      ? "✅ 完整掃描完成。"
      : "✅ 快速分析完成。";

  } catch (e) {
    console.error(e);

    if (analysisTimerId) {
      const finalSeconds = stopAnalysisTimer();
      document.getElementById("elapsed").textContent =
        finalSeconds.toFixed(1) + " 秒";
    }

    statusBox.textContent = "❌ " + e.message;
  } finally {
    busy = false;
    updateButtons();

    setTimeout(() => {
      progress.style.display = "none";
      bar.style.width = "0%";
    }, 700);
  }
}

imageInput.addEventListener("change", async () => {
  selectedFile =
    imageInput.files && imageInput.files[0]
      ? imageInput.files[0]
      : null;

  if (!selectedFile) {
    preview.style.display = "none";
    updateButtons();
    return;
  }

  preview.src = URL.createObjectURL(selectedFile);
  preview.style.display = "block";
  resultBox.style.display = "none";
  updateButtons();

  if (ocrReady) {
    await analyzeOrder(false);
  } else {
    statusBox.textContent = "截圖已選擇，OCR 準備完成後可按「快速重新分析」。";
  }
});

analyzeBtn.addEventListener("click", () => analyzeOrder(false));
fullScanBtn.addEventListener("click", () => analyzeOrder(true));

loadTesseract();
</script>

</body>
</html>
