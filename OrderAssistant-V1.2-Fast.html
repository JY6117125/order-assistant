<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Order Assistant V1.2 Fast</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }
    .card {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 6px 25px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 4px; font-size: 27px; }
    .sub { color: #666; margin-bottom: 18px; }
    label { display: block; margin: 15px 0 7px; font-weight: 700; }
    input[type="number"], input[type="file"] {
      width: 100%;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
    }
    button:disabled { opacity: .45; }
    #preview {
      display: none;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      margin-top: 16px;
      border-radius: 13px;
      background: #eee;
    }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 11px;
      background: #f2f2f4;
      color: #555;
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .progress {
      display: none;
      height: 8px;
      margin-top: 12px;
      background: #ddd;
      border-radius: 999px;
      overflow: hidden;
    }
    #bar {
      height: 100%;
      width: 0%;
      background: #111;
      transition: width .15s ease;
    }
    .result {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 16px;
      background: #f2f2f4;
    }
    .decision {
      font-size: 31px;
      font-weight: 900;
      margin-bottom: 14px;
    }
    .good { color: #15803d; }
    .bad { color: #c62828; }
    .row { padding: 5px 0; font-size: 17px; }
    .big { font-weight: 800; }
    .muted { color: #777; font-size: 12px; margin-top: 14px; }
    details { margin-top: 16px; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 10px;
      background: #fff;
      border-radius: 10px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Order Assistant V1.2</h1>
  <div class="sub">快速 OCR：先掃訂單區，失敗才掃全圖</div>

  <label for="threshold">最低接受時薪 ($/hr)</label>
  <input id="threshold" type="number" inputmode="decimal" value="30" min="0" step="1" />

  <label for="imageInput">選擇 Uber / Mubo 訂單截圖</label>
  <input id="imageInput" type="file" accept="image/*" />

  <img id="preview" alt="訂單截圖預覽" />

  <button id="analyzeBtn" disabled>重新分析</button>

  <div class="progress" id="progress"><div id="bar"></div></div>

  <div class="status" id="status">正在載入 OCR…</div>

  <div class="result" id="result">
    <div id="decision" class="decision"></div>

    <div class="row">💰 總價：<span id="price" class="big">—</span></div>
    <div class="row">🚗 去接客時間：<span id="pickupTime" class="big">—</span> 分鐘</div>
    <div class="row">🧍 行程時間：<span id="tripTime" class="big">—</span> 分鐘</div>
    <div class="row">⏱ 總時間：<span id="totalTime" class="big">—</span> 分鐘</div>
    <div class="row">💵 預計時薪：<span id="hourly" class="big">—</span></div>
    <div class="row">📍 去接客距離：<span id="pickupDistance" class="big">—</span></div>
    <div class="row">🛣 行程距離：<span id="tripDistance" class="big">—</span></div>
    <div class="row">🚘 總距離：<span id="totalDistance" class="big">—</span></div>
    <div class="row">💲 每英里：<span id="perMile" class="big">—</span></div>
    <div class="row">⚡ 分析時間：<span id="elapsed" class="big">—</span></div>

    <details>
      <summary>查看 OCR 原文</summary>
      <pre id="ocrText"></pre>
    </details>
  </div>

  <div class="muted">
    V1.2 會先裁剪圖片並縮小尺寸，只讀訂單常見區域；如果資料不足，才自動用全圖再試一次。
  </div>
</div>

<script>
"use strict";

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const analyzeBtn = document.getElementById("analyzeBtn");
const thresholdInput = document.getElementById("threshold");
const statusBox = document.getElementById("status");
const progress = document.getElementById("progress");
const bar = document.getElementById("bar");
const resultBox = document.getElementById("result");

let selectedFile = null;
let worker = null;
let ocrReady = false;
let busy = false;

const savedThreshold = localStorage.getItem("orderAssistantThreshold");
if (savedThreshold !== null) thresholdInput.value = savedThreshold;

thresholdInput.addEventListener("change", () => {
  localStorage.setItem("orderAssistantThreshold", thresholdInput.value);
});

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.async = true;
    s.onload = resolve;
    s.onerror = () => {
      s.remove();
      reject(new Error("載入失敗：" + src));
    };
    document.head.appendChild(s);
  });
}

async function loadTesseract() {
  const sources = [
    "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js",
    "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"
  ];

  for (const src of sources) {
    try {
      await loadScript(src);
      if (window.Tesseract) {
        ocrReady = true;
        statusBox.textContent = "✅ OCR 已載入。請選擇截圖。";
        updateButton();
        warmUpWorker();
        return;
      }
    } catch (e) {
      console.warn(e);
    }
  }

  statusBox.textContent =
    "❌ OCR 無法載入。\n請確認有網路，而且用 Safari / HTTPS 網頁開啟。";
}

function updateButton() {
  analyzeBtn.disabled = !selectedFile || !ocrReady || busy;
}

async function warmUpWorker() {
  try {
    await ensureWorker();
    if (!selectedFile && !busy) {
      statusBox.textContent = "✅ OCR 已準備好。選擇截圖後會自動分析。";
    }
  } catch (e) {
    console.warn("Worker 預載失敗", e);
  }
}

function logger(m) {
  if (typeof m.progress === "number") {
    progress.style.display = "block";
    bar.style.width = Math.round(m.progress * 100) + "%";
  }
}

async function ensureWorker() {
  if (worker) return worker;
  if (!window.Tesseract) throw new Error("Tesseract 尚未載入。");

  statusBox.textContent = "正在初始化 OCR…";
  progress.style.display = "block";
  bar.style.width = "5%";

  worker = await window.Tesseract.createWorker("eng", 1, { logger });

  // Sparse text：適合 App 截圖上分散的文字
  await worker.setParameters({
    tessedit_pageseg_mode: "11",
    preserve_interword_spaces: "1"
  });

  return worker;
}

function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => reject(new Error("無法讀取圖片。"));
    img.src = url;
  });
}

function makeFastCrop(img, fullImage = false) {
  // 第一輪只讀中下方 78%：通常訂單卡、時間、距離、價錢都在這範圍。
  // 若第一輪資料不足，第二輪會自動讀全圖。
  const cropX = 0;
  const cropY = fullImage ? 0 : Math.floor(img.naturalHeight * 0.22);
  const cropW = img.naturalWidth;
  const cropH = fullImage
    ? img.naturalHeight
    : img.naturalHeight - cropY;

  // 大幅減少 OCR 像素量
  const MAX_WIDTH = 900;
  const scale = Math.min(1, MAX_WIDTH / cropW);

  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(cropW * scale));
  canvas.height = Math.max(1, Math.round(cropH * scale));

  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(
    img,
    cropX, cropY, cropW, cropH,
    0, 0, canvas.width, canvas.height
  );

  // 輕量灰階 + 對比，改善白字/黑底及地圖 UI 的辨識
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imageData.data;

  for (let i = 0; i < d.length; i += 4) {
    const gray = Math.round(0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]);
    // 溫和對比
    const v = Math.max(0, Math.min(255, (gray - 128) * 1.25 + 128));
    d[i] = d[i+1] = d[i+2] = v;
  }

  ctx.putImageData(imageData, 0, 0);
  return canvas;
}

function normalizeText(text) {
  return (text || "")
    .replace(/\r/g, "\n")
    .replace(/[|]/g, "I")
    .replace(/[“”]/g, "\"")
    .replace(/[‘’]/g, "'");
}

function extractOrderData(text) {
  const t = normalizeText(text);

  let price = null;

  const dollarPrice = [...t.matchAll(/\$\s*([0-9]{1,3}(?:[.,][0-9]{1,2})?)/g)];
  if (dollarPrice.length) {
    price = parseFloat(dollarPrice[0][1].replace(",", "."));
  } else {
    // OCR 偶爾把 $ 認成 S
    const sPrice = t.match(/\b[Ss]\s*([0-9]{1,3}[.,][0-9]{2})\b/);
    if (sPrice) {
      price = parseFloat(sPrice[1].replace(",", "."));
    } else {
      const fallback = t.match(/\b([0-9]{1,3}[.,][0-9]{2})\b/);
      if (fallback) price = parseFloat(fallback[1].replace(",", "."));
    }
  }

  const times = [...t.matchAll(
    /\b([0-9]{1,3})\s*(?:min|mins|minute|minutes)\b/gi
  )]
    .map(m => parseInt(m[1], 10))
    .filter(n => n > 0 && n <= 300);

  const distances = [...t.matchAll(
    /\b([0-9]+(?:[.,][0-9]+)?)\s*(?:mi|mile|miles)\b/gi
  )]
    .map(m => parseFloat(m[1].replace(",", ".")))
    .filter(n => n >= 0 && n < 500);

  return { price, times, distances };
}

function hasEnoughData(data) {
  return data.price !== null && data.times.length >= 2;
}

function render(data, rawText, startedAt) {
  if (!hasEnoughData(data)) {
    throw new Error(
      "仍然讀不到完整價錢 + 兩段時間。請展開 OCR 原文並把內容貼給我。"
    );
  }

  const pickupTime = data.times[0];
  const tripTime = data.times[1];
  const totalTime = pickupTime + tripTime;
  const hourly = data.price / (totalTime / 60);

  const threshold = parseFloat(thresholdInput.value) || 0;
  const shouldAccept = hourly >= threshold;

  const pickupDistance = data.distances.length >= 1 ? data.distances[0] : null;
  const tripDistance = data.distances.length >= 2 ? data.distances[1] : null;
  const totalDistance =
    pickupDistance !== null && tripDistance !== null
      ? pickupDistance + tripDistance
      : null;

  const perMile =
    totalDistance && totalDistance > 0
      ? data.price / totalDistance
      : null;

  document.getElementById("price").textContent = "$" + data.price.toFixed(2);
  document.getElementById("pickupTime").textContent = pickupTime;
  document.getElementById("tripTime").textContent = tripTime;
  document.getElementById("totalTime").textContent = totalTime;
  document.getElementById("hourly").textContent = "$" + hourly.toFixed(2) + "/hr";

  document.getElementById("pickupDistance").textContent =
    pickupDistance !== null ? pickupDistance.toFixed(1) + " mi" : "未讀到";

  document.getElementById("tripDistance").textContent =
    tripDistance !== null ? tripDistance.toFixed(1) + " mi" : "未讀到";

  document.getElementById("totalDistance").textContent =
    totalDistance !== null ? totalDistance.toFixed(1) + " mi" : "未讀到";

  document.getElementById("perMile").textContent =
    perMile !== null ? "$" + perMile.toFixed(2) + "/mi" : "未讀到";

  document.getElementById("elapsed").textContent =
    ((performance.now() - startedAt) / 1000).toFixed(1) + " 秒";

  document.getElementById("ocrText").textContent = rawText;

  const decision = document.getElementById("decision");
  decision.textContent = shouldAccept ? "✅ 可以接" : "❌ 不建議接";
  decision.className = shouldAccept ? "decision good" : "decision bad";

  resultBox.style.display = "block";
}

async function analyzeOrder() {
  if (!selectedFile || busy) return;

  busy = true;
  updateButton();
  resultBox.style.display = "none";
  progress.style.display = "block";
  bar.style.width = "2%";

  const startedAt = performance.now();

  try {
    const img = await fileToImage(selectedFile);
    const w = await ensureWorker();

    // 1) 快速模式：裁剪 + 縮小
    statusBox.textContent = "⚡ 快速掃描訂單區…";
    const fastCanvas = makeFastCrop(img, false);
    let recognition = await w.recognize(fastCanvas);
    let rawText = recognition.data.text || "";
    let data = extractOrderData(rawText);

    // 2) 如果資料不足，自動 fallback 全圖
    if (!hasEnoughData(data)) {
      statusBox.textContent = "快速掃描資料不足，正在用全圖再試一次…";
      bar.style.width = "10%";

      const fullCanvas = makeFastCrop(img, true);
      recognition = await w.recognize(fullCanvas);
      rawText = recognition.data.text || "";
      data = extractOrderData(rawText);
    }

    render(data, rawText, startedAt);
    bar.style.width = "100%";
    statusBox.textContent = "✅ 分析完成。";

  } catch (e) {
    console.error(e);
    statusBox.textContent = "❌ 分析失敗：\n" + e.message;
  } finally {
    busy = false;
    updateButton();

    setTimeout(() => {
      progress.style.display = "none";
      bar.style.width = "0%";
    }, 900);
  }
}

imageInput.addEventListener("change", async () => {
  selectedFile = imageInput.files && imageInput.files[0]
    ? imageInput.files[0]
    : null;

  if (!selectedFile) {
    preview.style.display = "none";
    updateButton();
    return;
  }

  preview.src = URL.createObjectURL(selectedFile);
  preview.style.display = "block";
  resultBox.style.display = "none";
  updateButton();

  if (ocrReady) {
    statusBox.textContent = "截圖已選擇，正在自動分析…";
    await analyzeOrder();
  } else {
    statusBox.textContent = "截圖已選擇，等 OCR 準備好後再按「重新分析」。";
  }
});

analyzeBtn.addEventListener("click", analyzeOrder);

// 啟動
loadTesseract();

</script>
</body>
</html>
